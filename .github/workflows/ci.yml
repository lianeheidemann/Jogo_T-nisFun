name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Compile check
        run: python -m compileall main.py tenis_fun

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .
